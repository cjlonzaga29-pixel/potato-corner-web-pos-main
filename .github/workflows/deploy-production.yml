name: Deploy to Production

# No workflow_dispatch trigger on purpose: the "production" environment has no
# deployment-branch policy, so a manual trigger could deploy any branch. To
# retry a main deploy, use "Re-run jobs" on its run — that re-uses the same
# commit and re-runs validate before deploy.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Runs ci.yml (the same job PRs run) on the pushed commit, outside the
  # production environment: no secrets, no reviewer prompt, read-only token.
  # The owner is only asked to approve deploy-production after this passes.
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy-production:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      deployments: write
    # One production deploy at a time. cancel-in-progress stays false so a
    # running migration/Render deploy is never killed; GitHub instead replaces
    # an older *pending* deploy (queued or awaiting approval, nothing run yet)
    # with the newer one. The superseded-commit check below covers the rest.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Pinned Vercel target (identifiers, not credentials): the
      # potato-corner-pos project in the cjlonzaga29-pixels-projects team.
      VERCEL_ORG_ID: team_ixozcUgz2KZlGr8LQ09X6AEr
      VERCEL_PROJECT_ID: prj_yVPZZumoPDxbGuADZ4JeetWCKl0V
      VERCEL_PRODUCTION_DOMAINS: potatorenovare.com,www.potatorenovare.com
      # Pinned Render production API service; RENDER_SERVICE_ID_PRODUCTION
      # must name exactly this service, built from this repo's main.
      RENDER_EXPECTED_SERVICE_ID: srv-d9cok48js32c73dss310
      RENDER_EXPECTED_REPO: https://github.com/${{ github.repository }}
      RENDER_EXPECTED_BRANCH: main
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Validation can finish out of order across pushes, and approval can wait
      # for hours. Only deploy this commit if it is still the tip of main once
      # the job holds the deploy lock; otherwise a newer push's run owns the
      # deploy and this older commit must not overwrite it.
      - name: Skip if a newer commit has reached main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TIP=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$TIP" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deploying $GITHUB_SHA: main is now at $TIP, whose own run deploys it."
          fi

      - uses: pnpm/action-setup@v4
        if: ${{ steps.tip.outputs.current == 'true' }}
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        if: ${{ steps.tip.outputs.current == 'true' }}
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: ${{ steps.tip.outputs.current == 'true' }}
        run: pnpm install --frozen-lockfile

      # Who publishes production web for THIS commit is read from the commit
      # itself (apps/web/vercel.json git.deploymentEnabled.main). "git": the
      # Vercel Git integration already published it on push, ungated, and this
      # job only verifies it. "workflow": Git deploys of main are off at this
      # commit, so this job builds and deploys it below. Exactly one publisher
      # per commit — never both, never neither. See the P43 runbook.
      - name: Determine web publisher for this commit
        id: web
        if: ${{ steps.tip.outputs.current == 'true' }}
        run: |
          set -euo pipefail
          MODE=$(node .github/scripts/deploy-rollout.mjs web-mode apps/web/vercel.json)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Production web publisher for $GITHUB_SHA: $MODE"

      # Fail before any production write if a credential needed to deploy and
      # verify this release is missing. Names only; values are never printed.
      - name: Check deployment credentials
        if: ${{ steps.tip.outputs.current == 'true' }}
        env:
          PRODUCTION_DATABASE_URL_DIRECT: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}
          RENDER_DEPLOY_HOOK_PRODUCTION: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_PRODUCTION: ${{ secrets.RENDER_SERVICE_ID_PRODUCTION }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          for name in PRODUCTION_DATABASE_URL_DIRECT RENDER_DEPLOY_HOOK_PRODUCTION RENDER_API_KEY RENDER_SERVICE_ID_PRODUCTION VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing production environment secrets:$missing. Nothing was deployed. Add them to the 'production' environment, then re-run this job."
            exit 1
          fi
          echo "All deployment credentials are present."

      # Fail closed before any production write unless the pinned Render
      # service is the one configured and its Auto-Deploy is off; with it on,
      # Render would deploy every main push without validation or approval.
      # Enabled, unknown, missing or unreadable all fail. Read-only: the
      # setting is never changed from here.
      - name: Verify Render service and Auto-Deploy off (production)
        if: ${{ steps.tip.outputs.current == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_PRODUCTION: ${{ secrets.RENDER_SERVICE_ID_PRODUCTION }}
        run: node .github/scripts/deploy-rollout.mjs render-preflight

      # Workflow-published web only: build the exact checkout before any
      # production write, so a build failure stops the release early and the
      # new-API/old-web window below is just the upload, not a full build.
      - name: Install Vercel CLI
        if: ${{ steps.tip.outputs.current == 'true' && steps.web.outputs.mode == 'workflow' }}
        run: npm install --global vercel@59.11.7

      - name: Build apps/web for Vercel production (this commit)
        if: ${{ steps.tip.outputs.current == 'true' && steps.web.outputs.mode == 'workflow' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"

      # Manual approval is enforced via the "production" GitHub Environment's
      # required reviewers setting, not a workflow step. It is requested only
      # after the validate job above has passed for this exact commit.

      - name: Run database migrations (production)
        # Uses the direct (non-pooled) connection string, not the pooler
        # secret below — the session pooler caps concurrent clients at 15
        # and migrate deploy needs a session-level connection of its own.
        if: ${{ steps.tip.outputs.current == 'true' }}
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}

      # Re-runs the Render service/Auto-Deploy check, triggers the hook with
      # ref=<this SHA>, then polls the deploy id the
      # hook returned on RENDER_SERVICE_ID_PRODUCTION until it is live at this
      # SHA. Failed/cancelled/replaced deploys, a wrong service or commit, and
      # the 25-minute bound all fail the job. Replaces the old blind sleep 45.
      - name: Deploy apps/api to Render and wait until live (production)
        if: ${{ steps.tip.outputs.current == 'true' }}
        timeout-minutes: 30
        env:
          RENDER_DEPLOY_HOOK_PRODUCTION: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_PRODUCTION: ${{ secrets.RENDER_SERVICE_ID_PRODUCTION }}
        run: node .github/scripts/deploy-rollout.mjs render

      # Web goes out only after the new API is verified live, so the new web
      # never talks to the old API. (Git-published web skips this: it is
      # already out, see "Determine web publisher".)
      - name: Deploy apps/web to Vercel production (this commit)
        id: vercel
        if: ${{ steps.tip.outputs.current == 'true' && steps.web.outputs.mode == 'workflow' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed $URL"

      # Both modes: every production domain must be aliased to a READY
      # production deployment of this SHA in the pinned project (workflow
      # mode: to exactly the deployment created above).
      - name: Verify production web is serving this commit
        if: ${{ steps.tip.outputs.current == 'true' }}
        timeout-minutes: 20
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOYMENT_URL: ${{ steps.vercel.outputs.url }}
        run: node .github/scripts/deploy-rollout.mjs vercel-verify

      - name: Install Playwright Chromium (pilot smoke suite only needs Desktop Chrome)
        if: ${{ steps.tip.outputs.current == 'true' && env.E2E_SUPER_ADMIN_EMAIL != '' }}
        run: pnpm exec playwright install --with-deps chromium
        env:
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}

      - name: Run Playwright smoke tests against production
        # Skips instead of failing the run when pilot accounts haven't been
        # provisioned yet (Phase 20 Task 16 — pilot go-live cutover). Same
        # graceful-skip pattern as the Render deploy step above.
        if: ${{ steps.tip.outputs.current == 'true' && env.E2E_SUPER_ADMIN_EMAIL != '' }}
        run: pnpm exec playwright test --config=tests/e2e/playwright.pilot.config.ts
        env:
          PLAYWRIGHT_BASE_URL: https://www.potatorenovare.com
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
          E2E_SUPERVISOR_EMAIL: ${{ secrets.E2E_SUPERVISOR_EMAIL }}
          E2E_SUPERVISOR_PASSWORD: ${{ secrets.E2E_SUPERVISOR_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}

      - name: Report skipped smoke tests
        if: ${{ steps.tip.outputs.current == 'true' && env.E2E_SUPER_ADMIN_EMAIL == '' }}
        env:
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
        run: echo "::notice::Production smoke tests SKIPPED — E2E_SUPER_ADMIN_EMAIL is not configured. API and web rollout were verified; behaviour was not smoke-tested."

      - name: Create GitHub release with auto-generated changelog
        # Tag the commit that was validated and deployed, not whatever main
        # points at by now.
        if: ${{ steps.tip.outputs.current == 'true' }}
        run: gh release create "prod-$(date +%Y%m%d-%H%M%S)" --title "Production deploy $(date +%Y-%m-%d)" --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
