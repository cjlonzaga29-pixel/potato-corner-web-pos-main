name: CI

on:
  pull_request:
    branches: [main, staging]
  # deploy-production.yml calls this same job as its `validate` gate, so
  # main pushes and PRs run one definition of lint/type-check/test/build.
  # A called workflow inherits the caller's event context, so checkout below
  # gets the pushed commit (github.sha) — the exact SHA that later deploys.
  workflow_call: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/potato_corner_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/potato_corner_test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: potato_corner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production rollout polling/verification used by deploy-production.yml.
      # Node built-in test runner; no network, no secrets.
      - name: Deployment script tests
        run: node --test ".github/scripts/*.test.mjs"

      # E2E target/write guards (POS-PERF-P44). Node built-in runner; no
      # browser, no network, no secrets.
      - name: E2E guard tests
        run: node --test tests/e2e/helpers/guards.node-test.mts

      - name: Set up test environment
        # apps/api/vitest.setup.ts loads apps/api/.env via dotenv/config at
        # test-file-import time. .env is correctly gitignored, so CI has no
        # env vars unless we provide them. .env.example's placeholder values
        # are non-secret strings that already satisfy config/index.ts's zod
        # schema (`.min(1)` string checks, no real-secret format enforced) —
        # copying it in is enough for tests that import real (non-mocked)
        # modules at the top of the config-dependent import chain, without
        # committing or referencing any actual secret.
        #
        # @prisma/client's own bundled env-loader ALSO reads apps/api/.env
        # the moment any test file constructs a PrismaClient. Root
        # .env.example's DATABASE_URL/DIRECT_URL point at the local
        # full-stack dev DB (wrong password and DB name for this job's
        # Postgres service) — copying them in as-is let something in the
        # turbo -> vitest -> Prisma Client chain resolve DATABASE_URL from
        # that file's value instead of this job's real one, so every
        # DB-touching integration test failed with "Authentication failed
        # ... for `postgres`" right after "Run database migrations (CI)"
        # had just succeeded with the correct value. Rewriting both lines
        # to the current shell's value (this job's real service container
        # URL, already correct in env: above) makes every possible source
        # agree, regardless of which one actually wins.
        #
        # ENCRYPTION_KEY / HASH_KEY: .env.example's placeholders pass the zod
        # `.min(1)` check but are not 32-byte keys, so AES-256-GCM
        # (lib/encryption.ts) throws "Invalid key length" in any integration
        # test that stores a PWD/Senior ID. Each job generates two independent
        # throwaway 32-byte keys (base64, the encoding getKey()/getHashKey()
        # decode). Never production secrets; masked and never echoed. Base64
        # never contains `#`, so it is a safe sed delimiter.
        run: |
          cp .env.example apps/api/.env
          sed -i "s#^DATABASE_URL=.*#DATABASE_URL=$DATABASE_URL#" apps/api/.env
          sed -i "s#^DIRECT_URL=.*#DIRECT_URL=$DIRECT_URL#" apps/api/.env
          set +x
          test_encryption_key=$(openssl rand -base64 32)
          test_hash_key=$(openssl rand -base64 32)
          echo "::add-mask::$test_encryption_key"
          echo "::add-mask::$test_hash_key"
          sed -i "s#^ENCRYPTION_KEY=.*#ENCRYPTION_KEY=$test_encryption_key#" apps/api/.env
          sed -i "s#^HASH_KEY=.*#HASH_KEY=$test_hash_key#" apps/api/.env
          unset test_encryption_key test_hash_key
          node -e '
            const env = require("node:fs").readFileSync("apps/api/.env", "utf8");
            for (const name of ["ENCRYPTION_KEY", "HASH_KEY"]) {
              const lines = env.split("\n").filter((line) => line.startsWith(name + "="));
              if (lines.length !== 1 || Buffer.from(lines[0].slice(name.length + 1), "base64").length !== 32) {
                console.error(name + " is not exactly one 32-byte base64 key in apps/api/.env");
                process.exit(1);
              }
            }'

      - name: Generate Prisma client
        run: pnpm --filter @potato-corner/api exec prisma generate

      - name: Run database migrations (CI)
        # DATABASE_URL/DIRECT_URL both point at the job-level Postgres
        # service container (raw direct connection, no pooler — matches
        # the CI row of the three-URL pattern in phase-19-debt.md).
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Unit and integration tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
